<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flask ChatGPT</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; }
    #chat { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; border-radius: 8px; }
    .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; max-width: 80%; white-space: pre-wrap; }
    .user { background: #d9ecff; margin-left: auto; }
    .assistant { background: #f1f1f1; }
    #form { display: flex; gap: 8px; margin-top: 10px; }
    #input { flex: 1; padding: 10px; }
    button { padding: 10px 16px; }
  </style>
</head>
<body>
  <h2>Flask ChatGPT</h2>
  <div id="chat"></div>

  <form id="form">
    <input id="input" placeholder="Type your message..." autocomplete="off" required />
    <button type="submit">Send</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    let messages = [];

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      messages.push({ role: "user", content: text });
      input.value = "";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages }),
        });
        const data = await res.json();

        if (data.error) {
          addMessage("assistant", "Error: " + data.error);
        } else {
          addMessage("assistant", data.reply);
          messages.push({ role: "assistant", content: data.reply });
        }
      } catch (err) {
        addMessage("assistant", "Network error: " + err.message);
      }
    });
  </script>
</body>
</html>
